name: Release-plz

permissions: {}

on:
  push:
    branches:
      - main

# A release in flight must finish, so never cancel it. Do not add `queue: max`:
# release-plz acts on the SHA it checked out, and a stale queued run from an
# older main would act on old state. The default (one pending run, replaced by
# the newest push) is what we want, since the newest run releases anything
# still unreleased.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-plz-release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.repository_owner == 'jdx' }}
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    outputs:
      tag: ${{ steps.release-plz.outputs.releases && fromJSON(steps.release-plz.outputs.releases)[0].tag || steps.untagged.outputs.tag || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
      # release-plz publishes to crates.io before it tags, and skips a version
      # crates.io already has. So a run that fails between the two (as v6.1.0's
      # did, on an API rate limit) would leave that version untagged for good.
      # This tags it at the commit crates.io records, with the workflow's own
      # token, and drafts its release so the notes are still enhanced.
      - name: Tag a published version that has no tag
        id: untagged
        if: ${{ steps.release-plz.outputs.releases == '[]' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "pklr") | .version')
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            exit 0
          fi
          if ! curl -sSfL -A "pklr-release (https://github.com/jdx/pklr)" -o "$RUNNER_TEMP/pklr.crate" \
            "https://crates.io/api/v1/crates/pklr/$version/download"; then
            echo "pklr $version is not on crates.io, so there is nothing to tag"
            exit 0
          fi
          sha=$(tar -xzOf "$RUNNER_TEMP/pklr.crate" "pklr-$version/.cargo_vcs_info.json" | jq -r .git.sha1)
          if ! git merge-base --is-ancestor "$sha" HEAD; then
            echo "::error::crates.io records $sha for pklr $version, which is not on this branch"
            exit 1
          fi
          tag_object=$(gh api "repos/$REPO/git/tags" -f tag="$tag" -f object="$sha" -f type=commit \
            -f message="chore: Release package pklr version $version" --jq .sha)
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$tag_object" --silent
          awk -v heading="## [$version]" \
            'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found { print }' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh api "repos/$REPO/releases" -f tag_name="$tag" -f name="$tag" -F draft=true \
            -F body=@"$RUNNER_TEMP/notes.md" --silent
          echo "Tagged $tag at $sha"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  enhance-release:
    name: Enhance release notes
    needs: release-plz-release
    if: ${{ needs.release-plz-release.outputs.tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          cache: false
      - run: communique generate "$RELEASE_TAG" --github-release
        env:
          RELEASE_TAG: ${{ needs.release-plz-release.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  release-plz-pr:
    name: Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.repository_owner == 'jdx' }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
          persist-credentials: false
      - name: Run release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
